name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rasd
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: rasd_test_ci
          TZ: Asia/Riyadh
          PGTZ: Asia/Riyadh
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U rasd -d rasd_test_ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://rasd:test-only@localhost:5432/rasd_test_ci
      ANTHROPIC_API_KEY: ''
      MONID_API_KEY: ''
      SMTP_URL: ''
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
